# ============================================================
# Central Configuration & Version Management (Single Source of Truth)
# ============================================================
version: "v1.0"

# Execution Mode: 'sample' (quick E2E run on sample data) or 'full' (full dataset)
mode: "sample"

data:
  sample_file: "data/sample/atomic_spadl_sample.csv"
  types_meta: "data/sample/atomic_spadl_types_korean.csv"
  bodyparts_meta: "data/sample/bodyparts_korean.csv"
  raw_dir: "data/raw"
  refined_dir: "data/refined/v1.0"

results:
  base_dir: "results"
  models_dir: "results/models/v1.0"
  metrics_dir: "results/metrics/v1.0"
  analysis_dir: "results/analysis/v1.0"

# Track 1: Next Action Prediction (xAction)
xaction:
  seq_len: 10
  rare_type_min_count: 5
  normalize_direction: true
  model_type: "transformer"  # options: transformer, gru, lstm
  hidden_dim: 64
  num_layers: 2
  batch_size: 64
  learning_rate: 0.001
  epochs: 3
  loss_type_weight: 1.0
  loss_cat_weight: 0.5
  device: "auto"

# Track 2: Expected Pass (xPass)
xpass:
  model_type: "xgboost"
  n_estimators: 50
  max_depth: 4
  learning_rate: 0.1
  subsample: 0.8
  eval_metric: "logloss"

# Track 3: Valuing Actions by Estimating Probabilities (VAEP)
vaep:
  nb_prev_actions: 3
  horizon: 5
  hidden_dims: [64, 32]
  dropout: 0.3
  batch_size: 128
  learning_rate: 0.001
  epochs: 3
  patience: 3

# Track 4: Correlation & Integration Analysis
analysis:
  correlation_methods: ["spearman", "pearson"]
